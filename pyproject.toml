[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "milk10k"
version = "0.1.0"
description = "MILK10k skin-lesion classification project - EADA Computer Vision & Speech Recognition"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["milk10k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
